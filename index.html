<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182033">
<title>Kingside – Play & Learn Chess</title>
<script>try{var d=localStorage.dm||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.mode=d;document.documentElement.dataset.board=localStorage.bt||"walnut"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<header><h1>Kingside</h1><div class="row"><button data-a="menu">New game</button><button data-a="learn">Learn</button><button data-a="full" aria-label="Full view" title="Full view">⛶</button><button id="modeb" data-a="mode" aria-label="Switch between light and dark mode"></button></div></header>
<main>
<section id="stage">
<div id="top" class="pl"></div>
<div id="scene"><div id="board" role="grid" aria-label="Chess board"></div><div id="gl" hidden></div></div>
<div id="bot" class="pl"></div>
<div id="castle" class="row"></div>
</section>
<aside>
<div id="status" aria-live="polite"></div>
<div id="lesson" hidden><h2 id="lt"></h2><p id="lx"></p><div class="row"><button data-a="lprev">Back</button><button data-a="lnext" id="ln">Next</button></div></div>
<div id="view">
<div class="row"><button id="b3d" data-a="3d">3D view</button><button data-a="flip">Flip board</button></div>
<label>Tilt<input id="tilt" type="range" min="0" max="70" value="50"></label>
<label>Turn<input id="rot" type="range" min="-180" max="180" value="0"></label>
<small>In 3D: drag the board to rotate it, scroll or pinch to zoom, tap to move.</small>
</div>
<div id="themes" class="row"><button data-b="walnut" style="--a:#efd7a8;--b:#a9683a"><i class="sw"></i>Walnut</button><button data-b="parchment" style="--a:#eadcb9;--b:#ad6130"><i class="sw"></i>Parchment</button><button data-b="ocean" style="--a:#e9eff7;--b:#6f93b8"><i class="sw"></i>Ocean</button></div>
<div id="moves"></div>
<div class="row"><button data-a="undo">Undo</button><button data-a="hint">Hint</button><button data-a="menu">Restart</button></div>
</aside>
</main>
<button id="fx" data-a="unfull">✕ Exit full view</button>
<footer id="ver"></footer>
<div id="upd" hidden>New version <b id="updv"></b> is ready. <button data-a="reload">Refresh now</button></div>
<dialog id="dlg"></dialog>
<script src="lib/peerjs.min.js"></script>
<script src="board3d.js"></script>
<script src="app.js"></script>
</body>
</html>
